<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جلب صفحة من iscae.mr</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f4f4f4;
    }
    #content-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .error {
      color: red;
    }
    .loading {
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>

  <h1>محتوى جلب من iscae.mr</h1>

  <!-- حاوية المحتوى -->
  <div id="content-container">
    <p class="loading">جارٍ تحميل المحتوى...</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const contentContainer = document.getElementById("content-container");

      // الرابط إلى الخادم Proxy
      const proxyUrl = 'https://yourproxyserver.com/proxy.php'; // استبدل هذا برابط الخادم الفعلي

      // إخفاء نص التحميل عند بدء الجلب
      contentContainer.innerHTML = '<p class="loading">جارٍ تحميل البيانات...</p>';

      // استخدم Fetch API لجلب المحتوى من خادم Proxy
      fetch(proxyUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("حدث خطأ أثناء الاتصال بالخادم.");
          }
          return response.text(); // تحويل الرد إلى نص HTML
        })
        .then(html => {
          // تحديث المحتوى المعروض في الصفحة
          contentContainer.innerHTML = html;
        })
        .catch(error => {
          // في حال حدوث أي خطأ، إظهار رسالة خطأ
          contentContainer.innerHTML = `
            <p class="error">حدث خطأ: ${error.message}</p>
          `;
        });
    });
  </script>

</body>
</html>
